<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:white;
}
header{
  background:#111;
  text-align:center;
  padding:14px;
  font-size:20px;
  font-weight:bold;
}
.stage-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  background:#111;
}
button{
  flex:1;
  min-width:80px;
  padding:14px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}
button:active{background:#555;}

.hud{
  padding:10px;
  background:#121212;
  font-size:15px;
}

#status{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}

.map{
  width:100%;
  height:75vh;
  background:#000;
}

iframe{
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<header>🏍️ ADV LIVE RIDE MODE — iPhone Safe</header>

<div class="stage-buttons">
  <button onclick="loadStage(1)">S1</button>
  <button onclick="loadStage(2)">S2</button>
  <button onclick="loadStage(3)">S3</button>
  <button onclick="loadStage(4)">S4</button>
  <button onclick="loadStage(5)">S5</button>
  <button onclick="loadStage(6)">S6</button>
  <button onclick="loadStage(7)">S7</button>
  <button onclick="loadStage(8)">S8</button>
</div>

<div class="hud">
Tap a stage to load the map.<br>
If riding remote: keep one stage open at a time for best performance.
<div id="status">🟢 READY</div>
</div>

function loadStage(n){

  const url = maps[n];

  document.getElementById("mapContainer").innerHTML =
    `<iframe src="${url}"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"></iframe>`;

  document.getElementById("status").innerHTML =
    "🧭 Stage " + n + " loaded";
}
